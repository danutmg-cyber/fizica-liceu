<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invata Formulele - Fizica Liceu</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--accent);
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .test-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .test-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: rgba(56, 189, 248, 0.05);
            border: 1px solid var(--border);
            padding: 16px 20px;
            border-radius: 10px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .test-link:hover {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .test-link span.arrow {
            color: var(--accent);
            font-weight: bold;
            transition: transform 0.2s ease;
        }

        .test-link:hover span.arrow {
            transform: translateX(4px);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Învață Formulele</h1>
        <p class="subtitle">Teste interactive de fizică pentru Bacalaureat</p>

        <div class="test-list">
            <a href="1-test-mecanica.html" class="test-link">
                <span>1. Test Mecanică</span>
                <span class="arrow">&rarr;</span>
            </a>
            <a href="2-test-electricitate.html" class="test-link">
                <span>2. Test Electricitate</span>
                <span class="arrow">&rarr;</span>
            </a>
            <a href="3-test-termodinamica.html" class="test-link">
                <span>3. Test Termodinamică</span>
                <span class="arrow">&rarr;</span>
            </a>
            <a href="4-test-optica.html" class="test-link">
                <span>4. Test Optică</span>
                <span class="arrow">&rarr;</span>
            </a>
        </div>

        <footer>
            Fizică Liceu &bull; Pregătire Bacalaureat[cite: 2]
        </footer>
    </div>

</body>
</html>
