<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Teste de Bacalaureat la Fizică, organizate pe ani.">
  <title>Teste BAC Fizică</title>

  <link rel="stylesheet" href="../assets/css/main.css">

  <style>
    [hidden] { display: none !important; }

    body {
      min-height: 100vh;
    }

    .bac-home {
      width: min(900px, calc(100% - 28px));
      margin: 0 auto;
      padding: clamp(32px, 7vw, 72px) 0;
    }

    .bac-home h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(2rem, 7vw, 3.6rem);
      line-height: 1.1;
    }

    .subtitle {
      margin: 0 auto 34px;
      max-width: 650px;
      text-align: center;
      color: #cbd5e1;
      font-size: clamp(1.05rem, 2.5vw, 1.2rem);
      line-height: 1.6;
    }

    .year-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .year-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 14px 18px;
      border: 1px solid #60a5fa;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: clamp(1.05rem, 2.4vw, 1.25rem);
      font-weight: 700;
      transition: transform .15s ease, filter .15s ease;
    }

    .year-btn:hover,
    .year-btn:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    footer {
      margin-top: 42px;
      padding-top: 18px;
      border-top: 1px solid rgba(148, 163, 184, .25);
      text-align: center;
      color: #cbd5e1;
      line-height: 1.6;
    }

    footer a {
      color: #93c5fd;
    }

    @media (max-width: 640px) {
      .year-grid {
        grid-template-columns: 1fr;
      }

      .year-btn {
        min-height: 60px;
      }
    }
  </style>
</head>

<body>
  <main class="bac-home">
    <h1>Teste BAC Fizică</h1>
    <p class="subtitle">
      Alege anul pentru a deschide subiectele PDF și rezolvările disponibile.
    </p>

    <nav class="year-grid" aria-label="Teste BAC organizate pe ani">
      <a class="year-btn" href="./2019/index.html">Bacalaureat 2019</a>
<a class="year-btn" href="./2020/index.html">Bacalaureat 2020</a>
<a class="year-btn" href="./2021/index.html">Bacalaureat 2021</a>
<a class="year-btn" href="./2022/index.html">Bacalaureat 2022</a>
<a class="year-btn" href="./2023/index.html">Bacalaureat 2023</a>
<a class="year-btn" href="./2024/index.html">Bacalaureat 2024</a>
<a class="year-btn" href="./2025/index.html">Bacalaureat 2025</a>
<a class="year-btn" href="./2026/index.html">Bacalaureat 2026</a>
    </nav>

    <footer>
      <strong>Prof. Dănuț Andronie</strong><br>
      e-Mail: <a href="mailto:danutmg@gmail.com">danutmg@gmail.com</a>
    </footer>
  </main>
</body>
</html>
