    <h1>Experiment: determinarea vitezei medii</h1>
    <p>Măsoară distanța parcursă și durata mișcării, apoi calculează viteza medie.</p>
    <div class="formula">
      <strong>vₘ = d / Δt</strong>
      <span>d — distanța (m) · Δt — durata (s) · vₘ — viteza medie (m/s)</span>
