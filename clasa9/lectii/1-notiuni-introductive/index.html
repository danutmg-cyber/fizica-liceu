<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noțiuni Introductive - Fizică Clasa a IX-a</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;

      /* Paletă culori lecții */
      --c1: #2563eb; --bg1: #eff6ff; --b1: #bfdbfe; /* Albastru */
      --c2: #0284c7; --bg2: #f0f9ff; --b2: #bae6fd; /* Sky */
      --c3: #0d9488; --bg3: #f0fdfa; --b3: #99f6e4; /* Teal */
      --c4: #16a34a; --bg4: #f0fdf4; --b4: #bbf7d0; /* Verde */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      border: 1px solid var(--border);
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 0.25rem;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      list-style: none;
    }

    .nav-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-radius: 10px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .nav-button:hover {
      transform: translateY(-2px);
    }

    /* Stiluri colorate pe fiecare lecție */
    .les-1 { background-color: var(--bg1); border-color: var(--b1); }
    .les-1:hover { border-color: var(--c1); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15); }
    .les-1 .arrow { color: var(--c1); }

    .les-2 { background-color: var(--bg2); border-color: var(--b2); }
    .les-2:hover { border-color: var(--c2); box-shadow: 0 4px 12px rgba(2, 132, 199, 0.15); }
    .les-2 .arrow { color: var(--c2); }

    .les-3 { background-color: var(--bg3); border-color: var(--b3); }
    .les-3:hover { border-color: var(--c3); box-shadow: 0 4px 12px rgba(13, 148, 136, 0.15); }
    .les-3 .arrow { color: var(--c3); }

    .les-4 { background-color: var(--bg4); border-color: var(--b4); }
    .les-4:hover { border-color: var(--c4); box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15); }
    .les-4 .arrow { color: var(--c4); }

    .arrow {
      font-size: 1.25rem;
      font-weight: bold;
      transition: transform 0.2s ease;
    }

    .nav-button:hover .arrow {
      transform: translateX(4px);
    }

    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .back-link:hover {
      color: var(--c1);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Noțiuni Introductive</h1>
      <p class="subtitle">Capitolul 1 • Fizică Clasa a IX-a</p>
    </header>

    <main>
      <ul class="nav-list">
        <li>
          <a href="1-1-marimi-si-unitati.html" class="nav-button les-1">
            <span>1. Mărimi fizice și unități de măsură</span>
            <span class="arrow">&rarr;</span>
          </a>
        </li>
        <li>
          <a href="1-2-sistemul-international.html" class="nav-button les-2">
            <span>2. Sistemul Internațional de Unități (SI)</span>
            <span class="arrow">&rarr;</span>
          </a>
        </li>
        <li>
          <a href="1-3-vectori-introducere.html" class="nav-button les-3">
            <span>3. Elemente de calcul vectorial</span>
            <span class="arrow">&rarr;</span>
          </a>
        </li>
        <li>
          <a href="1-4-erori-de-masurare.html" class="nav-button les-4">
            <span>4. Erori de măsurare și prelucrarea datelor</span>
            <span class="arrow">&rarr;</span>
          </a>
        </li>
      </ul>
    </main>

    <footer>
      <a href="../index.html" class="back-link">&larr; Înapoi la cuprinsul lecțiilor</a>
    </footer>
  </div>

</body>
</html>
