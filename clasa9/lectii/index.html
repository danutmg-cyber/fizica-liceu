<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lecții – Clasa a IX-a</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .menu {
            width: min(90%, 520px);
            display: grid;
            gap: 16px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 70px;
            padding: 18px;

            background: #2563eb;
            color: white;

            text-align: center;
            text-decoration: none;

            font-size: 1.25rem;
            font-weight: bold;

            border-radius: 10px;

            transition: background 0.2s, transform 0.2s;
        }

        a:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <nav class="menu">

        <a href="mecanica-newtoniana/">
            Mecanică newtoniană
        </a>

        <a href="teoreme-conservare/">
            Teoreme de conservare
        </a>

        <a href="statica/">
            Statică
        </a>

        <a href="optica-geometrica/">
            Optică geometrică
        </a>

    </nav>

</body>
</html>
