<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lecții – Fizică clasa a XI-a</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: #333;
      margin-bottom: 25px;
      text-align: center;
    }

    .container-capitole {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .card-capitol {
      background-color: #ffffff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.08);
      border-left: 6px solid #2b6cb0;
      transition: all 0.3s ease;
    }

    .card-capitol.predat {
      border-left-color: #28a745;
      background-color: #f0fdf4;
    }

    .btn-capitol {
      display: block;
      width: 100%;
      padding: 12px 15px;
      background-color: #2b6cb0;
      color: white;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
      border-radius: 6px;
      box-sizing: border-box;
      transition: background-color 0.2s ease;
    }

    .btn-capitol:hover {
      background-color: #1a4971;
    }

    .zona-profesor {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.9em;
      color: #4a5568;
    }

    .zona-profesor label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-weight: 500;
    }

    .zona-profesor input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .zona-profesor input[type="date"] {
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #cbd5e0;
      font-family: inherit;
    }
  </style>
</head>
<body>

  <h1>Lecții – Fizică clasa a XI-a</h1>

  <div class="container-capitole">

    <!-- Capitolul 1 -->
    <div class="card-capitol" data-id="c11-cap1">
      <a href="01-recapitulare/index.html" class="btn-capitol">01. Recapitulare și evaluare inițială</a>
      <div class="zona-profesor">
        <label>
          <input type="checkbox" class="bifa-predare" onchange="salveazaStare('c11-cap1')">
          Predat / Finalizat la clasă
        </label>
        <input type="date" class="data-predare" onchange="salveazaStare('c11-cap1')">
      </div>
    </div>

    <!-- Capitolul 2 -->
    <div class="card-capitol" data-id="c11-cap2">
      <a href="02-oscilatorul-mecanic/index.html" class="btn-capitol">02. Oscilatorul mecanic</a>
      <div class="zona-profesor">
        <label>
          <input type="checkbox" class="bifa-predare" onchange="salveazaStare('c11-cap2')">
          Predat / Finalizat la clasă
        </label>
        <input type="date" class="data-predare" onchange="salveazaStare('c11-cap2')">
      </div>
    </div>

    <!-- Capitolul 3 -->
    <div class="card-capitol" data-id="c11-cap3">
      <a href="03-oscilatori-cuplati-rezonanta/index.html" class="btn-capitol">03. Oscilatori mecanici cuplați. Rezonanța</a>
      <div class="zona-profesor">
        <label>
          <input type="checkbox" class="bifa-predare" onchange="salveazaStare('c11-cap3')">
          Predat / Finalizat la clasă
        </label>
        <input type="date" class="data-predare" onchange="salveazaStare('c11-cap3')">
      </div>
    </div>

    <!-- Capitolul 4 -->
    <div class="card-capitol" data-id="c11-cap4">
      <a href="04-unde-mecanice/index.html" class="btn-capitol">04. Unde mecanice</a>
      <div class="zona-profesor">
        <label>
          <input type="checkbox" class="bifa-predare" onchange="salveazaStare('c11-cap4')">
          Predat / Finalizat la clasă
        </label>
        <input type="date" class="data-predare" onchange="salveazaStare('c11-cap4')">
      </div>
    </div>

    <!-- Capitolul 5 -->
    <div class="card-capitol" data-id="c11-cap5">
      <a href="05-circuitul-rlc/index.html" class="btn-capitol">05. Circuitul RLC în curent alternativ</a>
      <div class="zona-profesor">
        <label>
          <input type="checkbox" class="bifa-predare" onchange="salveazaStare('c11-cap5')">
          Predat / Finalizat la clasă
        </label>
        <input type="date" class="data-predare" onchange="salveazaStare('c11-cap5')">
      </div>
    </div>

    <!-- Capitolul 6 -->
    <div class="card-capitol" data-id="c11-cap6">
      <a href="06-oscilatii-si-unde-electromagnetice/index.html" class="btn-capitol">06. Oscilații și unde electromagnetice</a>
      <div class="zona-profesor">
        <label>
          <input type="checkbox" class="bifa-predare" onchange="salveazaStare('c11-cap6')">
          Predat / Finalizat la clasă
        </label>
        <input type="date" class="data-predare" onchange="salveazaStare('c11-cap6')">
      </div>
    </div>

    <!-- Capitolul 7 -->
    <div class="card-capitol" data-id="c11-cap7">
      <a href="07-optica-ondulatorie/index.html" class="btn-capitol">07. Optică ondulatorie</a>
      <div class="zona-profesor">
        <label>
          <input type="checkbox" class="bifa-predare" onchange="salveazaStare('c11-cap7')">
          Predat / Finalizat la clasă
        </label>
        <input type="date" class="data-predare" onchange="salveazaStare('c11-cap7')">
      </div>
    </div>

    <!-- Capitolul 8 -->
    <div class="card-capitol" data-id="c11-cap8">
      <a href="08-elemente-de-teoria-haosului/index.html" class="btn-capitol">08. Elemente de teoria haosului</a>
      <div class="zona-profesor">
        <label>
          <input type="checkbox" class="bifa-predare" onchange="salveazaStare('c11-cap8')">
          Predat / Finalizat la clasă
        </label>
        <input type="date" class="data-predare" onchange="salveazaStare('c11-cap8')">
      </div>
    </div>

  </div>

  <script>
    function salveazaStare(idCapitol) {
      const el = document.querySelector(`[data-id="${idCapitol}"]`);
      const bifa = el.querySelector('.bifa-predare').checked;
      const dataVal = el.querySelector('.data-predare').value;

      const dateCapitol = { bifa: bifa, data: dataVal };
      localStorage.setItem(idCapitol, JSON.stringify(dateCapitol));

      if (bifa) {
        el.classList.add('predat');
      } else {
        el.classList.remove('predat');
      }
    }

    function incarcaStari() {
      document.querySelectorAll('.card-capitol').forEach(el => {
        const idCapitol = el.getAttribute('data-id');
        const saved = localStorage.getItem(idCapitol);

        if (saved) {
          const date = JSON.parse(saved);
          const bifaInput = el.querySelector('.bifa-predare');
          const dataInput = el.querySelector('.data-predare');

          if (bifaInput) bifaInput.checked = date.bifa;
          if (dataInput) dataInput.value = date.data;

          if (date.bifa) {
            el.classList.add('predat');
          }
        }
      });
    }

    document.addEventListener('DOMContentLoaded', incarcaStari);
  </script>

</body>
</html>
