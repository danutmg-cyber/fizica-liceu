<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fizică – Clasa a XI-a</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
        }

        .menu {
            width: min(92%, 700px);
            display: grid;
            gap: 16px;
        }

        a {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 72px;
            padding: 18px 22px;

            background: #2563eb;
            color: white;

            text-align: center;
            text-decoration: none;

            font-size: 1.15rem;
            font-weight: bold;

            border-radius: 10px;

            transition: background 0.2s, transform 0.2s;
        }

        a:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <nav class="menu">

        <a href="lectii/">
            Lecții
        </a>

        <a href="recapitulare-finala/">
            Recapitulare finală
        </a>

        <a href="testare-finala/">
            Testare finală
        </a>

    </nav>

</body>
</html>
