<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Test Fizică – Anti-copiere</title>

<style>
body { font-family: Arial; margin: 20px; }
input, select { padding: 8px; margin: 5px 0; width: 250px; }
button { padding: 10px 20px; margin-top: 20px; }
#questionBox { margin-top: 30px; }
</style>

</head>
<body>

<h2>Test Fizică – Anti-copiere</h2>

<!-- FORMULAR ELEV -->
<div id="studentForm">
  <label>Nume și prenume:</label><br>
  <input id="nume" type="text"><br>

  <label>Clasa:</label><br>
  <select id="clasa">
    <option value="9A">9A</option>
    <option value="9B">9B</option>
    <option value="9C">9C</option>
    <option value="9D">9D</option>
  </select><br>

  <button onclick="startTest()">Începe testul</button>
</div>

<!-- ÎNTREBARE -->
<div id="questionBox" style="display:none;"></div>

<!-- BUTON URMĂTOAREA -->
<button id="nextBtn" style="display:none;" onclick="nextQuestion()">Următoarea întrebare</button>

<!-- REZULTATE -->
<div id="results" style="display:none;"></div>

<script>
// --------------------------------------------------
// ANTI-COPIERE
// --------------------------------------------------
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('copy', event => event.preventDefault());
document.addEventListener('cut', event => event.preventDefault());
document.addEventListener('paste', event => event.preventDefault());
document.addEventListener('selectstart', event => event.preventDefault());

document.addEventListener('keydown', function(e){
  if (e.key === "PrintScreen" || e.key === "F12" || e.ctrlKey || e.metaKey) {
    e.preventDefault();
  }
});

// --------------------------------------------------
// RANDOM
// --------------------------------------------------
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// --------------------------------------------------
// SETURI DE ÎNTREBĂRI
// --------------------------------------------------
function qPresiune(){
  let h=rnd(1,10), rho=rnd(900,1100), g=9.8, P=rho*g*h;
  return {
    text:`Calculează presiunea hidrostatică la adâncimea de ${h} m într-un lichid cu densitatea ${rho} kg/m³.`,
    correct:P.toFixed(0)+" Pa",
    choices:shuffle([
      P.toFixed(0)+" Pa",
      (P*0.9).toFixed(0)+" Pa",
      (P*1.1).toFixed(0)+" Pa",
      (P+500).toFixed(0)+" Pa"
    ])
  };
}

function qForta(){
  let P=rnd(10000,50000), A=rnd(2,10), F=P*A;
  return {
    text:`Un lichid exercită presiunea de ${P} Pa pe o suprafață de ${A} m². Determină forța.`,
    correct:F+" N",
    choices:shuffle([
      F+" N",
      (F*0.8).toFixed(0)+" N",
      (F*1.2).toFixed(0)+" N",
      (F+1000)+" N"
    ])
  };
}

function qTabel(){
  let x=rnd(10,50), t=rnd(2,10), v=x/t;
  return {
    text:`Completează tabelul și determină viteza.`,
    table:{x,t,v:v.toFixed(2)},
    correct:v.toFixed(2)+" m/s",
    choices:shuffle([
      v.toFixed(2)+" m/s",
      (v*0.9).toFixed(2)+" m/s",
      (v*1.1).toFixed(2)+" m/s",
      (v+1).toFixed(2)+" m/s"
    ])
  };
}

const sets=[qPresiune,qForta,qTabel];

// --------------------------------------------------
// LOGICĂ TEST
// --------------------------------------------------
let score=0, total=10, current=0;

function startTest(){
  document.getElementById("studentForm").style.display="none";
  document.getElementById("questionBox").style.display="block";
  document.getElementById("nextBtn").style.display="inline-block";
  nextQuestion();
}

function nextQuestion(){
  if(current>=total){ finishTest(); return; }

  let q=sets[rnd(0,sets.length-1)]();
  current++;

  let html=`<b>${current}. ${q.text}</b><br><br>`;

  if(q.table){
    html+=`
      <table border="1" cellpadding="5">
        <tr><th>x (m)</th><th>t (s)</th><th>v (m/s)</th></tr>
        <tr><td>${q.table.x}</td><td>${q.table.t}</td><td>${q.table.v}</td></tr>
      </table><br>
    `;
  }

  q.choices.forEach(c=>{
    html+=`<label><input type="radio" name="q" value="${c}"> ${c}</label><br>`;
  });

  html+=`<button onclick="checkAnswer('${q.correct}')">Verifică</button>`;

  document.getElementById("questionBox").innerHTML=html;
}

function checkAnswer(correct){
  let selected=document.querySelector('input[name="q"]:checked');
  if(selected && selected.value===correct) score++;
  nextQuestion();
}

function finishTest(){
  document.getElementById("questionBox").style.display="none";
  document.getElementById("nextBtn").style.display="none";

  let nume=document.getElementById("nume").value;
  let clasa=document.getElementById("clasa").value;

  let html=`<h3>Rezultate finale</h3>`;
  html+=`<p>Nume: <b>${nume}</b></p>`;
  html+=`<p>Clasa: <b>${clasa}</b></p>`;
  html+=`<p>Scor: <b>${score}/${total}</b></p>`;
  html+=`<button onclick="downloadResult()">Descarcă rezultatul</button>`;

  document.getElementById("results").innerHTML=html;
  document.getElementById("results").style.display="block";

  sendToSheets(nume,clasa,score,total);
}

// --------------------------------------------------
// DESCĂRCARE REZULTAT
// --------------------------------------------------
function downloadResult(){
  let text=document.getElementById("results").innerText;
  let blob=new Blob([text],{type:"text/plain"});
  let url=URL.createObjectURL(blob);
  let a=document.createElement("a");
  a.href=url;
  a.download="rezultat.txt";
  a.click();
}

// --------------------------------------------------
// TRIMITERE LA GOOGLE SHEETS
// --------------------------------------------------
function sendToSheets(nume,clasa,score,total){
  fetch("YOUR_WEB_APP_URL",{
    method:"POST",
    mode:"no-cors",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({nume,clasa,score,total})
  });
}

</script>

</body>
</html>
