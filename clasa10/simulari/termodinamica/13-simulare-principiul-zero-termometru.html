<!DOCTYPE html><html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Principiul zero și termometrul — simulare</title><style>body{margin:0;background:#f1f6fb;color:#19334b;font-family:system-ui,Arial,sans-serif}header{background:#12385f;color:white;padding:22px max(16px,calc((100vw - 1100px)/2))}h1{font-size:clamp(25px,3vw,34px)}main{max-width:1100px;margin:auto;padding:18px}.back{display:inline-block;background:#fff;color:#12385f;padding:12px 16px;border-radius:9px;text-decoration:none;font-size:18px;font-weight:700;margin:14px 0}.back:focus-visible{outline:3px solid #e39416;outline-offset:3px}#simulationApp{font-family:system-ui,Arial,sans-serif;color:#19334b;font-size:18px;line-height:1.55}#simulationApp *{box-sizing:border-box}#simulationApp .ct-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}#simulationApp .ct-card{background:#fff;border:1px solid #d4e2ee;border-radius:14px;padding:18px;margin:14px 0}#simulationApp label{display:block;margin:12px 0 5px;font-weight:650}#simulationApp input[type=range],#simulationApp select{width:100%;font:inherit;accent-color:#146aaf}#simulationApp select{padding:8px;border:1px solid #9bb5ca;border-radius:7px;background:#fff;color:#19334b}#simulationApp output{float:right;color:#0c5b95}#simulationApp button{background:#146aaf;color:#fff;border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;max-width:100%}#simulationApp button:disabled{opacity:.5;cursor:default}#simulationApp :focus-visible{outline:3px solid #e39416;outline-offset:3px}#simulationApp .ct-actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:15px 0}#simulationApp .ct-actions label{margin:0}#simulationApp .ct-actions select{width:auto}#simulationApp svg{display:block;width:100%;height:auto}#simulationApp .ct-readings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}#simulationApp .ct-readings div{background:#edf5fc;padding:10px;border-radius:8px;overflow-wrap:anywhere}#simulationApp .ct-readings span{display:block;font-size:15px}#simulationApp .ct-readings strong{font-size:19px}#simulationApp .ct-small{font-size:15px}#simulationApp .ct-note{border-left:5px solid #1976bd;background:#e9f4ff;padding:14px;font-size:16px}#simulationApp .ct-quiz{font-size:20px;line-height:1.6;background:#fff;border:1px solid #d4e2ee;border-radius:14px;padding:18px;margin-top:20px}#simulationApp .ct-quiz h3{font-size:26px}#simulationApp .ct-quiz button{font-size:20px}#simulationApp .ct-quiz label{font-weight:500;padding:7px 0}#simulationApp .ct-quiz input{width:20px;height:20px;accent-color:#146aaf}#simulationApp #ct-status{background:#f1f8ef;border-left:5px solid #44874a;padding:14px;min-height:75px}@media(max-width:760px){#simulationApp .ct-grid{grid-template-columns:1fr}#simulationApp .ct-card{padding:12px}#simulationApp .ct-readings{grid-template-columns:1fr}#simulationApp output{float:none;margin-left:8px}}

#simulationApp #z-status{background:#f1f8ef;border-left:5px solid #44874a;padding:14px;min-height:70px}#simulationApp #z-conclusion{background:#edf5fc;padding:12px;border-radius:8px}</style></head><body><header><a id="backTop" class="back" href="../../lectii/02-notiuni-termodinamice-de-baza/6-principiul-zero-al-termodinamicii.html#pagina-7-revenire">← Revenire în lecție</a><h1>Trei sisteme și un termometru: principiul zero</h1><p>Fizică · Clasa a X-a · Anticipează, experimentează, explică</p></header><main><div id="simulationApp"></div><a id="backBottom" class="back" href="../../lectii/02-notiuni-termodinamice-de-baza/6-principiul-zero-al-termodinamicii.html#pagina-7-revenire">← Revenire în lecție, la locul de plecare</a></main><script>(()=>{const n=Number(new URLSearchParams(location.search).get('returnPage'));const page=Number.isInteger(n)&&n>=1&&n<=8?n:7;const u=new URL('../../lectii/02-notiuni-termodinamice-de-baza/6-principiul-zero-al-termodinamicii.html',location.href);u.hash='pagina-'+page+'-revenire';['backTop','backBottom'].forEach(id=>document.getElementById(id).href=u.href);})();(()=>{'use strict';
const app=document.getElementById('simulationApp'),$=id=>app.querySelector('#z-'+id),f=(x,d=2)=>x.toFixed(d).replace('.',',');
const range=(id,label,value)=>`<label for="z-${id}">${label} <output id="z-${id}-out">${value} °C</output></label><input id="z-${id}" type="range" min="0" max="80" value="${value}">`;
app.innerHTML=`<p>Anticipează sensul transferului termic, conectează două sisteme și așteaptă stabilizarea. Apoi compară temperaturile.</p><div class="ct-grid"><div class="ct-card ct-controls"><label for="z-mode">Modul experimentului</label><select id="z-mode"><option value="reference">Principiul zero — C la temperatură constantă</option><option value="thermometer">Termometru — C cu capacitate termică finită</option></select>${range('a','Temperatura inițială A',60)}${range('b','Temperatura inițială B',10)}${range('c','Temperatura inițială C',30)}<label for="z-capacity">Capacitatea termică a termometrului C</label><select id="z-capacity"><option value="5">Mică — 5 J/K</option><option value="100">Mare — 100 J/K</option></select><p class="ct-small">Capacitățile termice A și B: câte 200 J/K. Modificarea unei condiții inițiale reinițializează experimentul.</p></div><div class="ct-card"><h3>Trei sisteme, un singur contact la un moment dat</h3><svg id="z-scene" viewBox="0 0 640 280" role="img" aria-label="Sistemele A și B și referința termică C"></svg><div id="z-readings" class="ct-readings"></div></div></div><div class="ct-actions"><button id="z-ac">Conectează A–C</button><button id="z-bc">Conectează B–C</button><button id="z-ab">Conectează A–B</button><button id="z-disconnect">Izolează sistemele</button></div><div class="ct-actions"><button id="z-resume" disabled>▶ Continuă</button><button id="z-pause" disabled>Ⅱ Pauză</button><button id="z-reset">↺ Reinițializează</button><label>Viteză <select id="z-speed"><option value="1">1×</option><option value="4">4×</option></select></label></div><p id="z-status" role="status"></p><div class="ct-card"><h3>Temperaturile în timp</h3><svg id="z-chart" viewBox="0 0 640 250" role="img" aria-label="Evoluția temperaturilor A, B și C"></svg><p class="ct-small"><span style="color:#176bb5">● A</span> · <span style="color:#c7640a">● B</span> · <span style="color:#6d3caf">● C</span> · Toate temperaturile sunt în °C.</p></div><div class="ct-card"><h3>Măsurări stabilizate</h3><p id="z-measures">Nicio măsurare stabilizată.</p><p id="z-conclusion"></p></div><p id="z-note" class="ct-note"></p><section class="ct-quiz"><h3>Verifică ce ai înțeles</h3><div id="z-questions"></div><button id="z-check">Verifică răspunsurile</button><p id="z-feedback" aria-live="polite"></p></section>`;
// Test de înțelegere: principiul zero și măsurarea temperaturii.
const questions=[['A și B sunt fiecare în echilibru termic cu aceeași referință C, menținută la aceeași temperatură. Ce putem concluziona?',['A și B sunt în echilibru termic între ele','A și B au obligatoriu aceeași masă','Există întotdeauna transfer termic de la A la B'],0],['Putem folosi prima indicație a unui termometru mai rece decât corpul?',['Nu; trebuie să așteptăm stabilizarea','Da; contactul înseamnă imediat echilibru','Da; masa termometrului nu contează'],0],['Un termometru cu capacitate termică mare poate modifica temperatura corpului măsurat?',['Da; transferul termic poate modifica starea corpului','Nu; nu primește energie','Doar dacă substanțele se amestecă'],0]];
$('questions').innerHTML=questions.map(([q,opts],i)=>`<fieldset style="border:0;padding:0;margin:15px 0"><legend>${i+1}. ${q}</legend>${opts.map((o,j)=>`<label><input type="radio" name="z-q${i}" value="${j}"> ${o}</label>`).join('')}</fieldset>`).join('');
let s,initial,contact=null,stage=null,running=false,time=0,last=0,history=[],measurements={};
const cap=()=>Number($('capacity').value),reference=()=>$('mode').value==='reference';
const energy=()=>200*s.a+200*s.b+cap()*s.c;
function reset(){s={a:Number($('a').value),b:Number($('b').value),c:Number($('c').value)};initial={...s};contact=null;stage=null;running=false;time=0;history=[];measurements={};$('capacity').disabled=reference();$('measures').textContent='Nicio măsurare stabilizată.';app.querySelectorAll('input[type=range]').forEach(el=>$(el.id.slice(2)+'-out').textContent=el.value+' °C');record();render();}
function connect(pair){running=true;contact=pair;stage={values:{...s},energy:energy()};render();}
function record(){history.push({time,a:s.a,b:s.b,c:s.c});if(history.length>800)history=history.filter((_,i)=>i%2===0);}
function evolve(dt){if(!contact)return;const [i,j]=contact,ci=i==='c'?cap():200,cj=j==='c'?cap():200;
 if(reference()&&j==='c')s[i]=s.c+(s[i]-s.c)*Math.exp(-.45*dt);
 else{const eq=(ci*s[i]+cj*s[j])/(ci+cj),d=Math.exp(-40*(1/ci+1/cj)*dt);s[i]=eq+(s[i]-eq)*d;s[j]=eq+(s[j]-eq)*d;}
 if(Math.abs(s[i]-s[j])<.05){if(reference()&&j==='c')s[i]=s.c;else{const eq=(ci*s[i]+cj*s[j])/(ci+cj);s[i]=eq;s[j]=eq;}running=false;if(j==='c'){measurements[i]={value:s.c,initial:stage.values[i],final:s[i],reference:s.c};$('measures').textContent=Object.entries(measurements).map(([id,m])=>`${id.toUpperCase()}: C = ${f(m.value)} °C ; corp înainte = ${f(m.initial)} °C ; după = ${f(m.final)} °C`).join(' | ');}}
}
const metric=(n,v)=>`<div><span>${n}</span><strong>${v}</strong></div>`;
function render(){const active=contact?.toUpperCase().split('').join('–')||'niciunul';let transfer='';if(contact){const [i,j]=contact;transfer=Math.abs(s[i]-s[j])<.1?'Echilibru aproximativ atins: transfer termic net neglijabil.':`Căldură: ${s[i]>s[j]?i.toUpperCase():j.toUpperCase()} → ${s[i]>s[j]?j.toUpperCase():i.toUpperCase()}.`;}
 const positions={a:[100,80],b:[530,80],c:[315,215]};let scene='';if(contact){const [i,j]=contact,[x,y]=positions[i],[u,v]=positions[j];scene+=`<path d="M${x} ${y}L${u} ${v}" stroke="#389164" stroke-width="5"/>`;}
 for(const [id,[x,y]] of Object.entries(positions)){scene+=`<rect x="${x-74}" y="${y-45}" width="148" height="90" rx="14" fill="${id==='a'?'#d9ecff':id==='b'?'#fff1da':'#ede5ff'}" stroke="#50677b"/><text x="${x}" y="${y-10}" text-anchor="middle" font-size="20">${id.toUpperCase()}${id==='c'?' — '+(reference()?'Referință':'Termometru'):''}</text><text x="${x}" y="${y+20}" text-anchor="middle" font-size="20">${f(s[id])} °C</text>`;}$('scene').innerHTML=scene;
 let read=metric('A ↔ C',Math.abs(s.a-s.c)<.1?'Temperaturi egale':'Temperaturi diferite')+metric('B ↔ C',Math.abs(s.b-s.c)<.1?'Temperaturi egale':'Temperaturi diferite')+metric('A ↔ B',Math.abs(s.a-s.b)<.1?'Temperaturi egale':'Temperaturi diferite');
 if(stage){const [i,j]=contact||['a','b'];read+=metric('Căldură primită de '+i.toUpperCase(),f((i==='c'?cap():200)*(s[i]-stage.values[i]))+' J');if(!(reference()&&j==='c'))read+=metric('ΔU total de la conectare',f(energy()-stage.energy,5)+' J');}
 $('readings').innerHTML=read;$('status').textContent=`Contact activ: ${active}. ${transfer} ${running?'Evoluție în curs.':contact?'Evoluție în pauză sau stabilizată.':'Sisteme separate: fără transfer termic între ele.'}`;
 const ac=Math.abs(s.a-s.c)<.1,bc=Math.abs(s.b-s.c)<.1;
 $('conclusion').textContent=reference()&&ac&&bc?'A și B sunt simultan în echilibru cu aceeași referință C: sunt în echilibru termic între ele. Dacă le conectăm, transferul termic net este neglijabil.':!reference()&&measurements.a&&measurements.b?'Măsurările succesive trebuie interpretate ținând cont de modificarea corpurilor și a lui C. O egalitate anterioară A–C nu garantează egalitatea actuală dacă temperatura lui C s-a schimbat.':'Principiul zero se referă la stări în echilibru cu aceeași referință termică. Simplul contact nu este suficient.';
 $('note').textContent=reference()?'C este menținut la temperatură constantă de un termostat exterior. A și B sunt izolate când nu sunt conectate. Acest mod verifică cele două echilibre cu aceeași referință; ansamblul nu este izolat energetic.':'C este un termometru cu capacitate termică finită. Pentru fiecare pereche conectată, energia totală se conservă: T final = (Ci·Ti + Cj·Tj)/(Ci + Cj). Termometrul poate modifica temperatura corpului. Nu există lucru mecanic sau schimbări de stare; timpul și conductanța modelului sunt ilustrative.';
 $('pause').disabled=!running;$('resume').disabled=running||!contact;drawChart();
}
function drawChart(){const min=Math.min(...history.flatMap(h=>[h.a,h.b,h.c]))-3,max=Math.max(...history.flatMap(h=>[h.a,h.b,h.c]))+3,t=Math.max(1,time),colors=['#176bb5','#c7640a','#6d3caf'];$('chart').innerHTML=`<path d="M55 20V210H615" fill="none" stroke="#54677c"/><text x="0" y="25" font-size="15">${f(max,0)} °C</text><text x="0" y="210" font-size="15">${f(min,0)} °C</text><text x="55" y="239" font-size="16">Timp de model [s]</text><text x="540" y="239" font-size="16">${f(time,1)} s</text>`+['a','b','c'].map((id,i)=>`<path d="${history.map((h,j)=>(j?'L':'M')+(55+550*h.time/t).toFixed(2)+' '+(210-(h[id]-min)/(max-min)*170).toFixed(2)).join(' ')}" fill="none" stroke="${colors[i]}" stroke-width="3"/>`).join('');}
app.querySelectorAll('.ct-controls input,.ct-controls select').forEach(el=>el.addEventListener('input',reset));for(const pair of ['ac','bc','ab'])$(pair).onclick=()=>connect(pair);$('disconnect').onclick=()=>{contact=null;stage=null;running=false;render();};$('pause').onclick=()=>{running=false;render();};$('resume').onclick=()=>{running=true;render();};$('reset').onclick=reset;
$('check').onclick=()=>{let count=0,answered=0;questions.forEach((q,i)=>{const chosen=app.querySelector(`input[name=z-q${i}]:checked`);if(chosen){answered++;if(Number(chosen.value)===q[2])count++;}});$('feedback').textContent=answered<3?'Răspunde la toate cele trei întrebări.':`Rezultat: ${count}/3. `+(count===3?'Corect! Contactul nu înseamnă echilibru instantaneu, iar termometrul poate modifica temperatura corpului.':'Revezi diferența dintre contact și echilibru și rolul capacității termice a termometrului.');};
reset();function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(running&&app.getBoundingClientRect().width>0){const delta=dt*Number($('speed').value);time+=delta;evolve(delta);record();render();}requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
</script></body></html>
