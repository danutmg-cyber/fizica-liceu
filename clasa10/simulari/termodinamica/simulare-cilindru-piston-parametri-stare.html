<script>

"use strict";


/* =========================================================
   CONSTANTE
========================================================= */

const R =
  8.314;


const AMOUNT =
  0.10;


/*
 * Domenii grafice
 */

const T_MIN = 250;
const T_MAX = 380;

const P_MIN = 60;
const P_MAX = 170;

const V_MIN = 1.5;
const V_MAX = 4.0;


/* =========================================================
   ELEMENTE
========================================================= */

const temperatureSlider =
  document.getElementById(
    "temperatureSlider"
  );


const pressureSlider =
  document.getElementById(
    "pressureSlider"
  );


const volumeSlider =
  document.getElementById(
    "volumeSlider"
  );


const temperatureValue =
  document.getElementById(
    "temperatureValue"
  );


const pressureValue =
  document.getElementById(
    "pressureValue"
  );


const volumeValue =
  document.getElementById(
    "volumeValue"
  );


const temperatureSliderValue =
  document.getElementById(
    "temperatureSliderValue"
  );


const pressureSliderValue =
  document.getElementById(
    "pressureSliderValue"
  );


const volumeSliderValue =
  document.getElementById(
    "volumeSliderValue"
  );


const stateBadge =
  document.getElementById(
    "stateBadge"
  );


const processStatus =
  document.getElementById(
    "processStatus"
  );


const gasBody =
  document.getElementById(
    "gasBody"
  );


const piston =
  document.getElementById(
    "piston"
  );


const pistonRod =
  document.getElementById(
    "pistonRod"
  );


const handle =
  document.getElementById(
    "handle"
  );


const particles =
  document.getElementById(
    "particles"
  );


const temperatureText =
  document.getElementById(
    "temperatureText"
  );


const pressArrow =
  document.getElementById(
    "pressArrow"
  );


const pullArrow =
  document.getElementById(
    "pullArrow"
  );


const heatingSymbol =
  document.getElementById(
    "heatingSymbol"
  );


const coolingSymbol =
  document.getElementById(
    "coolingSymbol"
  );


const heatLabel =
  document.getElementById(
    "heatLabel"
  );


const temperaturePath =
  document.getElementById(
    "temperaturePath"
  );


const pressurePath =
  document.getElementById(
    "pressurePath"
  );


const volumePath =
  document.getElementById(
    "volumePath"
  );


const graphTValue =
  document.getElementById(
    "graphTValue"
  );


const graphPValue =
  document.getElementById(
    "graphPValue"
  );


const graphVValue =
  document.getElementById(
    "graphVValue"
  );


const resetButton =
  document.getElementById(
    "resetButton"
  );


/* =========================================================
   STARE INIȚIALĂ
========================================================= */

let T =
  293;


let p =
  101.3;


/*
 * pV = νRT
 *
 * p în Pa
 * V în m³
 *
 * rezultatul este convertit în litri.
 */

let V =
  (
    AMOUNT *
    R *
    T /
    (
      p *
      1000
    )
  ) *
  1000;


let action =
  "equilibrium";


let transitionFrame =
  null;


let simTime =
  0;


let lastGraphSample =
  -1;


const history =
  [];


/* =========================================================
   FORMATARE
========================================================= */

function ro(
  value,
  decimals=1
){

  return Number(
    value
  )
  .toFixed(
    decimals
  )
  .replace(
    ".",
    ","
  );

}


function clamp(
  value,
  min,
  max
){

  return Math.min(
    max,
    Math.max(
      min,
      value
    )
  );

}


/* =========================================================
   ECUAȚIA DE STARE
========================================================= */

function volumeFromTP(
  temperature,
  pressureKPa
){

  return (
    AMOUNT *
    R *
    temperature /
    (
      pressureKPa *
      1000
    )
  ) *
  1000;

}


function pressureFromTV(
  temperature,
  volumeL
){

  return (
    AMOUNT *
    R *
    temperature /
    (
      volumeL /
      1000
    )
  ) /
  1000;

}


/* =========================================================
   GRAFIC
========================================================= */

function addHistoryPoint(){

  if(
    simTime -
    lastGraphSample <
    0.06
  ){

    return;

  }


  lastGraphSample =
    simTime;


  history.push({

    t:simTime,
    T,
    p,
    V

  });


  /*
   * Maximum aproximativ 25 s.
   */

  while(
    history.length >
    1 &&
    history[
      history.length -
      1
    ].t -
    history[
      0
    ].t >
    25
  ){

    history.shift();

  }

}


function mapY(
  value,
  min,
  max,
  top,
  bottom
){

  const fraction =
    (
      value -
      min
    ) /
    (
      max -
      min
    );


  return (
    bottom -
    fraction *
    (
      bottom -
      top
    )
  );

}


function buildPath(
  key,
  min,
  max,
  top,
  bottom
){

  if(
    history.length ===
    0
  ){

    return "";

  }


  const lastTime =
    history[
      history.length -
      1
    ].t;


  const firstTime =
    Math.max(
      0,
      lastTime -
      20
    );


  const range =
    Math.max(
      10,
      lastTime -
      firstTime
    );


  return history
    .filter(
      point=>
        point.t >=
        firstTime
    )
    .map(
      (
        point,
        index
      )=>{

        const x =
          65 +
          (
            (
              point.t -
              firstTime
            ) /
            range
          ) *
          390;


        const y =
          mapY(
            point[
              key
            ],
            min,
            max,
            top,
            bottom
          );


        return (
          (
            index ===
            0
          )
            ? `M ${x} ${y}`
            : `L ${x} ${y}`
        );

      }
    )
    .join(
      " "
    );

}


function updateGraph(){

  temperaturePath.setAttribute(
    "d",
    buildPath(
      "T",
      T_MIN,
      T_MAX,
      35,
      135
    )
  );


  pressurePath.setAttribute(
    "d",
    buildPath(
      "p",
      P_MIN,
      P_MAX,
      185,
      285
    )
  );


  volumePath.setAttribute(
    "d",
    buildPath(
      "V",
      V_MIN,
      V_MAX,
      335,
      435
    )
  );


  graphTValue.textContent =
    `${Math.round(
      T
    )} K`;


  graphPValue.textContent =
    `${ro(
      p,
      1
    )} kPa`;


  graphVValue.textContent =
    `${ro(
      V,
      2
    )} L`;

}


/* =========================================================
   CILINDRU
========================================================= */

function updateCylinder(){

  /*
   * Volum mare -> piston sus.
   *
   * y:
   * 310 pentru volum mic,
   * 125 pentru volum mare.
   */

  const fraction =
    (
      V -
      V_MIN
    ) /
    (
      V_MAX -
      V_MIN
    );


  const pistonY =
    310 -
    clamp(
      fraction,
      0,
      1
    ) *
    185;


  const gasY =
    pistonY +
    28;


  const gasHeight =
    430 -
    gasY;


  piston.setAttribute(
    "y",
    pistonY
  );


  pistonRod.setAttribute(
    "y",
    pistonY -
    140
  );


  handle.setAttribute(
    "y",
    pistonY -
    158
  );


  gasBody.setAttribute(
    "y",
    gasY
  );


  gasBody.setAttribute(
    "height",
    Math.max(
      20,
      gasHeight
    )
  );


  /*
   * Poziția particulelor se deplasează
   * odată cu pistonul.
   */

  particles.setAttribute(
    "transform",
    `translate(0 ${pistonY - 220})`
  );


  temperatureText.setAttribute(
    "y",
    Math.min(
      405,
      gasY +
      gasHeight *
      0.82
    )
  );


  temperatureText.textContent =
    `T = ${Math.round(T)} K`;


  /*
   * Culoarea gazului indică temperatura.
   */

  const tempFraction =
    clamp(
      (
        T -
        T_MIN
      ) /
      (
        T_MAX -
        T_MIN
      ),
      0,
      1
    );


  const hue =
    210 -
    195 *
    tempFraction;


  gasBody.setAttribute(
    "fill",
    `hsl(${hue},78%,68%)`
  );

}


/* =========================================================
   ACȚIUNE VIZUALĂ
========================================================= */

function updateAction(){

  pressArrow.setAttribute(
    "opacity",
    action ===
    "press"
      ? "1"
      : "0"
  );


  pullArrow.setAttribute(
    "opacity",
    action ===
    "pull"
      ? "1"
      : "0"
  );


  heatingSymbol.setAttribute(
    "opacity",
    action ===
    "heat"
      ? "1"
      : "0"
  );


  coolingSymbol.setAttribute(
    "opacity",
    action ===
    "cool"
      ? "1"
      : "0"
  );


  heatLabel.setAttribute(
    "opacity",
    (
      action ===
      "heat" ||
      action ===
      "cool"
    )
      ? "1"
      : "0"
  );


  if(
    action ===
    "heat"
  ){

    stateBadge.textContent =
      "Încălzire";


    processStatus.textContent =
      "Q > 0 • T crește • pistonul urcă";

  }


  else if(
    action ===
    "cool"
  ){

    stateBadge.textContent =
      "Răcire";


    processStatus.textContent =
      "Q < 0 • T scade • pistonul coboară";

  }


  else if(
    action ===
    "press"
  ){

    stateBadge.textContent =
      "Apăsare";


    processStatus.textContent =
      "Forță în jos • p crește • V scade";

  }


  else if(
    action ===
    "pull"
  ){

    stateBadge.textContent =
      "Tragere";


    processStatus.textContent =
      "Forță în sus • p scade • V crește";

  }


  else{

    stateBadge.textContent =
      "Echilibru";


    processStatus.textContent =
      "Stare de echilibru";

  }

}


/* =========================================================
   VALORI + CURSOARE
========================================================= */

function updateValues(){

  temperatureValue.textContent =
    `${Math.round(
      T
    )} K`;


  pressureValue.textContent =
    `${ro(
      p,
      1
    )} kPa`;


  volumeValue.textContent =
    `${ro(
      V,
      2
    )} L`;


  temperatureSlider.value =
    clamp(
      T,
      T_MIN,
      T_MAX
    );


  pressureSlider.value =
    clamp(
      p,
      P_MIN,
      P_MAX
    );


  volumeSlider.value =
    clamp(
      V,
      V_MIN,
      V_MAX
    );


  temperatureSliderValue.textContent =
    `${Math.round(
      T
    )} K`;


  pressureSliderValue.textContent =
    `${ro(
      p,
      1
    )} kPa`;


  volumeSliderValue.textContent =
    `${ro(
      V,
      2
    )} L`;


  updateCylinder();

  updateAction();

  updateGraph();

}


/* =========================================================
   TRANZIȚIE DINAMICĂ
========================================================= */

function startTransition(
  mode,
  targetValue
){

  if(
    transitionFrame !==
    null
  ){

    cancelAnimationFrame(
      transitionFrame
    );

  }


  const startT =
    T;


  const startP =
    p;


  const startV =
    V;


  let targetT =
    T;


  let targetP =
    p;


  let targetV =
    V;


  /*
   * Modificarea temperaturii:
   *
   * considerăm presiunea aproximativ
   * constantă pe durata încălzirii/răcirii.
   */

  if(
    mode ===
    "T"
  ){

    targetT =
      Number(
        targetValue
      );


    targetP =
      startP;


    targetV =
      volumeFromTP(
        targetT,
        targetP
      );


    action =
      targetT >
      startT
        ? "heat"
        : "cool";

  }


  /*
   * Modificarea presiunii:
   *
   * temperatura este menținută constantă,
   * iar volumul se ajustează.
   */

  if(
    mode ===
    "p"
  ){

    targetP =
      Number(
        targetValue
      );


    targetT =
      startT;


    targetV =
      volumeFromTP(
        targetT,
        targetP
      );


    action =
      targetP >
      startP
        ? "press"
        : "pull";

  }


  /*
   * Modificarea volumului:
   *
   * temperatura este menținută constantă,
   * iar presiunea se ajustează.
   */

  if(
    mode ===
    "V"
  ){

    targetV =
      Number(
        targetValue
      );


    targetT =
      startT;


    targetP =
      pressureFromTV(
        targetT,
        targetV
      );


    action =
      targetV <
      startV
        ? "press"
        : "pull";

  }


  targetT =
    clamp(
      targetT,
      T_MIN,
      T_MAX
    );


  targetP =
    clamp(
      targetP,
      P_MIN,
      P_MAX
    );


  targetV =
    clamp(
      targetV,
      V_MIN,
      V_MAX
    );


  const duration =
    900;


  let previousTimestamp =
    null;


  const start =
    performance.now();


  function animate(
    timestamp
  ){

    if(
      previousTimestamp ===
      null
    ){

      previousTimestamp =
        timestamp;

    }


    const dt =
      (
        timestamp -
        previousTimestamp
      ) /
      1000;


    previousTimestamp =
      timestamp;


    simTime +=
      dt;


    const fraction =
      clamp(
        (
          timestamp -
          start
        ) /
        duration,
        0,
        1
      );


    /*
     * Tranziție lină.
     */

    const ease =
      fraction <
      0.5
        ? 2 *
          fraction *
          fraction
        : 1 -
          Math.pow(
            -2 *
            fraction +
            2,
            2
          ) /
          2;


    if(
      mode ===
      "T"
    ){

      T =
        startT +
        (
          targetT -
          startT
        ) *
        ease;


      p =
        startP;


      V =
        volumeFromTP(
          T,
          p
        );

    }


    if(
      mode ===
      "p"
    ){

      p =
        startP +
        (
          targetP -
          startP
        ) *
        ease;


      T =
        startT;


      V =
        volumeFromTP(
          T,
          p
        );

    }


    if(
      mode ===
      "V"
    ){

      V =
        startV +
        (
          targetV -
          startV
        ) *
        ease;


      T =
        startT;


      p =
        pressureFromTV(
          T,
          V
        );

    }


    addHistoryPoint();

    updateValues();


    if(
      fraction <
      1
    ){

      transitionFrame =
        requestAnimationFrame(
          animate
        );

    }

    else{

      transitionFrame =
        null;


      action =
        "equilibrium";


      addHistoryPoint();

      updateValues();

    }

  }


  transitionFrame =
    requestAnimationFrame(
      animate
    );

}


/* =========================================================
   CURSOARE
========================================================= */

temperatureSlider.addEventListener(
  "input",
  ()=>{

    startTransition(
      "T",
      temperatureSlider.value
    );

  }
);


pressureSlider.addEventListener(
  "input",
  ()=>{

    startTransition(
      "p",
      pressureSlider.value
    );

  }
);


volumeSlider.addEventListener(
  "input",
  ()=>{

    startTransition(
      "V",
      volumeSlider.value
    );

  }
);


/* =========================================================
   RESET
========================================================= */

function resetSimulation(){

  if(
    transitionFrame !==
    null
  ){

    cancelAnimationFrame(
      transitionFrame
    );


    transitionFrame =
      null;

  }


  T =
    293;


  p =
    101.3;


  V =
    volumeFromTP(
      T,
      p
    );


  action =
    "equilibrium";


  simTime =
    0;


  lastGraphSample =
    -1;


  history.length =
    0;


  addHistoryPoint();

  updateValues();

}


resetButton.addEventListener(
  "click",
  resetSimulation
);


/* =========================================================
   INIȚIALIZARE
========================================================= */

addHistoryPoint();

updateValues();

</script>
