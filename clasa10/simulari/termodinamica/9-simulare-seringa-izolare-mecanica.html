<!DOCTYPE html>
<html lang="ro"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seringa: piston liber și izolare mecanică — Fizică, clasa a X-a</title><style>

cent-color:#146aaf}#simulationApp #ct-status{background:#f1f8ef;border-left:5px solid #44874a;padding:14px;min-height:75px}@media(max-width:760px){#simulationApp .ct-grid{grid-template-columns:1fr}#simulationApp .ct-card{padding:12px}#simulationApp .ct-readings{grid-template-columns:1fr}#simulationApp output{float:none;margin-left:8px}}
</style></head><body><header><a class="back" id="backTop" href="../../lectii/02-notiuni-termodinamice-de-baza/5-contact-mecanic-si-contact-termic.html#pagina-3-revenire">← Revenire în lecție</a><h1>Seringa: piston liber și izolare mecanică</h1><p>Fizică · Clasa a X-a · Predicție → experiment → explicație</p></header><main><div id="simulationApp" data-kind="syringe"></div><a class="back" id="backBottom" href="../../lectii/02-notiuni-termodinamice-de-baza/5-contact-mecanic-si-contact-termic.html#pagina-3-revenire">← Revenire în lecție, la locul de plecare</a></main><script>
(()=>{const p=new URLSearchParams(location.search);const n=Number(p.get('returnPage'));const page=Number.isInteger(n)&&n>=1&&n<=8?n:3;const u=new URL('../../lectii/02-notiuni-termodinamice-de-baza/5-contact-mecanic-si-contact-termic.html',location.href);u.hash='pagina-'+page+'-revenire';['backTop','backBottom'].forEach(id=>document.getElementById(id).href=u.href);})();
(()=>{'use strict';
const mount=document.getElementById('simulationApp'),kind=mount.dataset.kind;
const $=id=>mount.querySelector('#ct-'+id),fmt=(x,d=1)=>x.toFixed(d).replace('.',',');
const slider=(id,text,min,max,value,step=1)=>`<label for="ct-${id}">${text} <output id="ct-${id}-out">${value}</output></label><input id="ct-${id}" type="range" min="${min}" max="${max}" value="${value}" step="${step}">`;
const select=(id,text,options)=>`<label for="ct-${id}">${text}</label><select id="ct-${id}">${options.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>`;
let controls='',intro='',question='',options=[],correct=0,explanation='',note='';
if(kind==='piston'||kind==='lab'){
 intro='Două cantități fixe de gaz ideal monoatomic sunt separate printr-un piston. Recipientul exterior este rigid și izolat termic. Urmărește presiunile, temperaturile și volumele celor două compartimente.';
 controls=select('mechanical','Frontiera mecanică',[['movable','Piston mobil'],['rigid','Perete rigid']])+select('thermal','Frontiera termică',[['adiabatic','Adiabatică — fără transfer termic'],['diathermal','Diatermă — permite transfer termic']])+slider('pa','Presiunea inițială A [kPa]',70,180,140,5)+slider('pb','Presiunea inițială B [kPa]',70,180,100,5)+slider('ta','Temperatura inițială A [°C]',0,80,60)+slider('tb','Temperatura inițială B [°C]',0,80,20);
 question='Un perete rigid, dar diaterm, separă două gaze la temperaturi diferite. Ce este posibil?';options=['Transfer termic fără deplasarea frontierei','Deplasarea frontierei fără transfer termic','Niciun transfer de energie'];explanation='Peretele rigid împiedică lucrul mecanic prin deplasarea frontierei, dar caracterul diaterm permite transferul termic.';
 note='Model de relaxare amortizată: energia mișcării pistonului este restituită gazelor în părți egale. Nu modelăm oscilațiile unui piston ideal fără amortizare. Energia internă totală se conservă; nu există schimb de substanță. Presiunile sunt valori medii ale compartimentelor.';
}else if(kind==='syringe'){
 intro='O seringă etanșă conține aceeași cantitate de aer. Compară deplasarea pistonului cu blocarea sa și comprimarea lentă izotermă cu modelul adiabatic idealizat.';
 controls=select('lock','Piston',[['free','Liber'],['locked','Blocat în poziția curentă']])+select('mode','Modelul transformării',[['isothermal','Izoterm — în contact cu un termostat'],['adiabatic','Adiabatic reversibil idealizat']])+slider('volume','Volum [mL]',10,50,40);
 question='Dacă blocăm pistonul și mărim apăsarea exterioară, ce se întâmplă în modelul rigid?';options=['Volumul gazului rămâne constant','Volumul scade obligatoriu','Gazul pierde automat căldură'];explanation='Blocajul preia forța suplimentară. Fără deplasarea pistonului nu există lucru mecanic de comprimare prin această frontieră.';
 note='Stare de referință: V₀ = 40 mL, p₀ = 100 kPa, T₀ = 20 °C. Gaz ideal, γ = 1,4. Valorile energiei sunt calculate față de această stare, nu cumulate din mișcările cursorului. L primit este pozitiv la comprimare; ΔU = Q + L primit. Schimbarea modelului reinițializează starea.';
}else if(kind==='thermal'){
 intro='Două corpuri uniforme termic schimbă energie fără schimb de substanță și fără lucru mecanic. Ansamblul este izolat de exterior. Modifică masele și materialele pentru a afla temperatura de echilibru.';
 controls=slider('ta','Temperatura inițială A [°C]',0,100,80)+slider('tb','Temperatura inițială B [°C]',0,100,20)+slider('ma','Masa A [kg]',.1,2,1,.1)+slider('mb','Masa B [kg]',.1,2,1,.1)+select('ca','Material A',[['4180','Apă — c = 4180 J/(kg·K)'],['900','Aluminiu — c = 900 J/(kg·K)'],['385','Cupru — c = 385 J/(kg·K)']])+select('cb','Material B',[['4180','Apă — c = 4180 J/(kg·K)'],['900','Aluminiu — c = 900 J/(kg·K)'],['385','Cupru — c = 385 J/(kg·K)']])+select('thermal','Frontiera',[['diathermal','Diatermă'],['adiabatic','Adiabatică']]);
 question='Temperatura comună de echilibru este întotdeauna media aritmetică a temperaturilor inițiale?';options=['Nu; depinde de capacitățile termice m·c','Da, indiferent de mase și materiale','Da, dacă temperatura se exprimă în °C'];explanation='T final = (mA·cA·TA + mB·cB·TB)/(mA·cA + mB·cB). Media aritmetică apare când capacitățile termice sunt egale.';
 note='Model cu temperatură uniformă în fiecare corp, capacități termice constante și fără schimbări de stare. Ritmul animației este accelerat; timpul afișat nu este o predicție pentru un experiment real.';
}else{
 intro='Două pahare identice cu apă caldă primesc linguri identice ca masă: una metalică și una din plastic. Compară temperatura medie a lingurilor și răcirea apei.';
 controls=slider('water','Temperatura inițială a apei [°C]',30,90,60)+slider('spoon','Temperatura inițială a lingurilor [°C]',0,40,20);
 question='De ce lingura metalică se încălzește mai repede în acest model?';options=['Transferul termic este mai rapid prin metal','Plasticul este un perete adiabatic perfect','Metalul produce căldură din nimic'];explanation='Metalul conduce căldura mai bine. Plasticul permite și el transfer termic, dar mai lent; nu este un izolator perfect.';
 note='Fiecare pahar conține 200 g apă; fiecare lingură are 30 g. Folosim c metal = 500 și c plastic = 1500 J/(kg·K), cu conductanțe efective ilustrative diferite. Modelul urmărește temperatura medie, nu distribuția temperaturii pe mâner. Fiecare ansamblu apă–lingură este izolat de exterior.';
}
mount.innerHTML=`<p>${intro}</p>${kind==='lab'?`<div class="ct-actions" id="ct-presets"><button data-preset="movable,diathermal">Ambele contacte</button><button data-preset="movable,adiabatic">Numai mecanic</button><button data-preset="rigid,diathermal">Numai termic</button><button data-preset="rigid,adiabatic">Ambele izolate</button></div>`:''}<div class="ct-grid"><div class="ct-card ct-controls">${controls}</div><div class="ct-card"><h3>Observă și explică</h3><svg id="ct-scene" viewBox="0 0 640 260" role="img" aria-label="Reprezentarea stării sistemelor"></svg><div id="ct-readings" class="ct-readings"></div></div></div>${kind!=='syringe'?`<div class="ct-actions"><button id="ct-start">▶ Pornește</button><button id="ct-pause" disabled>Ⅱ Pauză</button><button id="ct-reset">↺ Reinițializează</button><label>Viteză <select id="ct-speed"><option value="1">1×</option><option value="4">4×</option></select></label></div>`:`<div class="ct-actions"><button id="ct-reset">↺ Reinițializează</button></div>`}<p id="ct-status" role="status"></p><div class="ct-card"><h3>Evoluția temperaturilor ${kind==='piston'||kind==='lab'?'și presiunilor':''}</h3><svg id="ct-chart" viewBox="0 0 640 250" role="img" aria-label="Grafic al evoluției parametrilor"></svg><p class="ct-small" id="ct-chart-key"></p></div><p class="ct-note">${note}</p><section class="ct-quiz"><h3>Verifică ce ai înțeles</h3><p>${question}</p>${options.map((o,i)=>`<label><input type="radio" name="ct-answer" value="${i}"> ${o}</label>`).join('')}<button id="ct-check">Verifică răspunsul</button><p id="ct-feedback" aria-live="polite"></p></section>`;
let state,initial,running=false,history=[],last=0,elapsed=0,accumulator=0;
const val=id=>Number($(id).value),isGas=kind==='piston'||kind==='lab';
const metric=(name,value)=>`<div><span>${name}</span><strong>${value}</strong></div>`;
function reset(){running=false;elapsed=0;history=[];accumulator=0;
 if(isGas){const R=8.314,cv=1.5*R;const ta=val('ta')+273.15,tb=val('tb')+273.15;const na=val('pa')*10/(R*ta),nb=val('pb')*10/(R*tb);state={va:10,ua:na*cv*ta,ub:nb*cv*tb,na,nb,cv,q:0,w:0};initial={...state};}
 else if(kind==='thermal'){state={ta:val('ta'),tb:val('tb'),a:val('ma')*val('ca'),b:val('mb')*val('cb')};initial={...state};}
 else if(kind==='spoons'){state={ta:val('spoon'),tb:val('spoon'),wa:val('water'),wb:val('water')};initial={...state};}
 else { $('volume').value=40;$('lock').value='free';$('volume').disabled=false;state={};}
 if($('start')){$('start').disabled=false;$('pause').disabled=true;}render(true);
}
function gas(){return {ta:state.ua/(state.na*state.cv),tb:state.ub/(state.nb*state.cv),pa:state.ua/(1.5*state.va),pb:state.ub/(1.5*(20-state.va))};}
function step(dt){
 if(isGas){let g=gas();let dv=$('mechanical').value==='movable'?Math.max(-.02,Math.min(.02,(g.pa-g.pb)*.012*dt)):0;dv=Math.max(.5-state.va,Math.min(19.5-state.va,dv));
 const diss=(g.pa-g.pb)*dv;const wa=-g.pa*dv+diss/2,wb=g.pb*dv+diss/2;
 const q=$('thermal').value==='diathermal'?1.5*(g.tb-g.ta)*dt:0;
 state.ua+=wa+q;state.ub+=wb-q;state.va+=dv;state.q+=q;state.w+=wa;
 }else if(kind==='thermal'){
 if($('thermal').value==='diathermal'){const eq=(initial.a*initial.ta+initial.b*initial.tb)/(initial.a+initial.b);const decay=Math.exp(-elapsed*.22);state.ta=eq+(initial.ta-eq)*decay;state.tb=eq+(initial.tb-eq)*decay;}
 }else if(kind==='spoons'){
 for(const [s,w,c,k] of [['ta','wa',15,1.4],['tb','wb',45,.08]]){const cw=836,eq=(c*initial[s]+cw*initial[w])/(c+cw),d=Math.exp(-k*(1/c+1/cw)*elapsed*10);state[s]=eq+(initial[s]-eq)*d;state[w]=eq+(initial[w]-eq)*d;}
 }
}
function arrow(x,y,text,color){return `<text x="${x}" y="${y}" text-anchor="middle" fill="${color}" font-size="18">${text}</text>`;}
function render(record=false){mount.querySelectorAll('input[type=range]').forEach(el=>$(el.id.slice(3)+'-out').textContent=el.value);
 let values=[],names=[],reading='',scene='',status='';
 if(isGas){const g=gas(),ta=g.ta-273.15,tb=g.tb-273.15,moving=$('mechanical').value==='movable',thermal=$('thermal').value==='diathermal',x=70+500*state.va/20;
 values=[ta,tb,g.pa,g.pb];names=['T A [°C]','T B [°C]','p A [kPa]','p B [kPa]'];
 reading=metric('A: presiune / temperatură',`${fmt(g.pa)} kPa / ${fmt(ta)} °C`)+metric('B: presiune / temperatură',`${fmt(g.pb)} kPa / ${fmt(tb)} °C`)+metric('Volume A / B',`${fmt(state.va,2)} / ${fmt(20-state.va,2)} L`)+metric('Q primit de A',`${fmt(state.q)} J`)+metric('L net primit de A',`${fmt(state.w)} J`)+metric('ΔU A / ΔU B',`${fmt(state.ua-initial.ua)} / ${fmt(state.ub-initial.ub)} J`);
 scene=`<rect x="70" y="45" width="500" height="150" rx="5" fill="#fff1da" stroke="#345" stroke-width="4"/><rect x="72" y="47" width="${x-72}" height="146" fill="#d9ecff"/><rect x="${x-4}" y="42" width="8" height="156" fill="${moving?'#53687e':'#252b33'}"/>${arrow((70+x)/2,105,'Gaz A','#165fa0')}${arrow((x+570)/2,105,'Gaz B','#ad5700')}${arrow(320,225,thermal?'Frontieră diatermă':'Frontieră adiabatică','#234')}${arrow(320,25,moving?'Piston mobil':'Perete rigid','#234')}`;
 const mech=Math.abs(g.pa-g.pb)<.15,therm=Math.abs(ta-tb)<.15;
 status=`${moving?'Piston: '+(mech?'fără tendință netă':g.pa>g.pb?'A → B':'B → A'):'Frontieră blocată: fără deplasare.'} ${thermal?'Transfer termic: '+(therm?'net neglijabil':ta>tb?'A → B':'B → A'):'Q = 0 prin frontieră.'} ${moving?'Echilibru mecanic: '+(mech?'aproximativ atins.':'încă neatins.'):'Peretele rigid poate susține presiuni diferite.'} ${thermal?'Echilibru termic: '+(therm?'aproximativ atins.':'încă neatins.'):'Izolarea termică nu cere temperaturi egale.'}`;
 if(running&&(!moving||mech)&&(!thermal||therm)){running=false;status+=' Evoluție încheiată.';}
 }else if(kind==='syringe'){
 const v=val('volume'),r=40/v,adiabatic=$('mode').value==='adiabatic',t=293.15*(adiabatic?Math.pow(r,.4):1),p=100*r*t/293.15,w=adiabatic?4/.4*(Math.pow(r,.4)-1):4*Math.log(r),q=adiabatic?0:-w,du=adiabatic?w:0;
 $('volume').disabled=$('lock').value==='locked';values=[t-273.15,p];names=['T [°C]','p [kPa]'];reading=metric('Volum',fmt(v)+' mL')+metric('Presiune',fmt(p)+' kPa')+metric('Temperatură',fmt(t-273.15)+' °C')+metric('L primit',fmt(w,3)+' J')+metric('Q primit',fmt(q,3)+' J')+metric('ΔU',fmt(du,3)+' J');const x=80+v*8;
 scene=`<rect x="75" y="75" width="410" height="110" fill="#f1f6fa" stroke="#345" stroke-width="4"/><rect x="78" y="78" width="${x-78}" height="104" fill="#cbe5ff"/><rect x="${x}" y="68" width="12" height="124" fill="#53687e"/><path d="M${x+12} 130H560" stroke="#53687e" stroke-width="12"/>${arrow(320,35,$('lock').value==='locked'?'Piston blocat':'Piston liber','#234')}${arrow(250,140,'Gaz etanș','#165fa0')}`;
 status=$('lock').value==='locked'?'Piston blocat: volumul rămâne fix; o forță suplimentară este preluată de blocaj.':'Deplasează cursorul volumului. La comprimare, gazul primește lucru mecanic.';
 }else if(kind==='thermal'){
 const eq=(initial.a*initial.ta+initial.b*initial.tb)/(initial.a+initial.b),qa=initial.a*(state.ta-initial.ta);values=[state.ta,state.tb];names=['T A [°C]','T B [°C]'];reading=metric('Temperatura A',fmt(state.ta)+' °C')+metric('Temperatura B',fmt(state.tb)+' °C')+metric('Echilibru posibil',fmt(eq)+' °C')+metric('Q primit de A / B',`${fmt(qa)} / ${fmt(-qa)} J`);
 scene=`<rect x="70" y="55" width="220" height="140" rx="12" fill="#d9ecff"/><rect x="350" y="55" width="220" height="140" rx="12" fill="#fff1da"/>${arrow(180,110,'A: '+fmt(state.ta)+' °C','#165fa0')}${arrow(460,110,'B: '+fmt(state.tb)+' °C','#ad5700')}${arrow(320,230,$('thermal').value==='adiabatic'?'Perete adiabatic — Q = 0':state.ta>state.tb?'Căldură A → B':state.tb>state.ta?'Căldură B → A':'Echilibru termic','#234')}`;
 status=$('thermal').value==='adiabatic'?'Transferul termic este blocat. Temperaturile pot rămâne diferite.':'Capacități termice A / B: '+fmt(initial.a)+' / '+fmt(initial.b)+' J/K. T final = (CA·TA + CB·TB)/(CA + CB).';
 if(running&&($('thermal').value==='adiabatic'||Math.abs(state.ta-state.tb)<.05))running=false;
 }else{
 values=[state.ta,state.tb,state.wa,state.wb];names=['Lingură metal [°C]','Lingură plastic [°C]','Apă cu metal [°C]','Apă cu plastic [°C]'];
 reading=metric('Lingură metalică',fmt(state.ta)+' °C')+metric('Lingură din plastic',fmt(state.tb)+' °C')+metric('Apă: pahar metal / plastic',fmt(state.wa)+' / '+fmt(state.wb)+' °C');
 scene=[['Metal',state.ta,state.wa,70,'#637b90'],['Plastic',state.tb,state.wb,350,'#da9362']].map(([name,t,w,x,c])=>`<rect x="${x}" y="90" width="220" height="120" rx="10" fill="#d9ecff" stroke="#345"/><rect x="${x+100}" y="35" width="18" height="150" rx="8" fill="${c}"/>${arrow(x+110,25,name,'#234')}${arrow(x+110,237,'Lingură: '+fmt(t)+' °C','#234')}${arrow(x+110,165,'Apă: '+fmt(w)+' °C','#165fa0')}`).join('');status='Plasticul se încălzește mai lent. Temperaturile finale pot diferi între pahare deoarece lingurile au capacități termice diferite.';
 if(running&&Math.abs(state.ta-state.wa)<.05&&Math.abs(state.tb-state.wb)<.05)running=false;
 }
 $('scene').innerHTML=scene;$('readings').innerHTML=reading;$('status').textContent=status;
 if($('start')){$('start').disabled=running;$('pause').disabled=!running;}
 if(record){history.push({t:elapsed,values});if(history.length>600)history.shift();}drawChart(names);
}
function drawChart(names){if(!history.length)return;const colors=['#176bb5','#c7640a','#6d3caf','#137248'];const all=history.flatMap(h=>h.values),min=Math.min(...all)-5,max=Math.max(...all)+5,tmax=Math.max(1,history.at(-1).t);const y=v=>210-(v-min)/(max-min)*170;
 $('chart').innerHTML=`<path d="M55 20V210H615" fill="none" stroke="#54677c"/><text x="4" y="30" font-size="13">${fmt(max,0)}</text><text x="4" y="210" font-size="13">${fmt(min,0)}</text><text x="55" y="239" font-size="14">${kind==='syringe'?'Succesiunea stărilor selectate':'Timp de model [s]'}</text><text x="540" y="239" font-size="14">${fmt(tmax)} s</text>`+names.map((n,i)=>`<path d="${history.map((h,j)=>(j?'L':'M')+(55+550*h.t/tmax).toFixed(2)+' '+y(h.values[i]).toFixed(2)).join(' ')}" fill="none" stroke="${colors[i]}" stroke-width="3"/>`).join('');
 $('chart-key').innerHTML=names.map((n,i)=>`<span style="color:${colors[i]}">● ${n}</span>`).join(' · ')+(isGas?' · Axă numerică comună; temperaturile și presiunile au unități diferite.':'');
}
mount.querySelectorAll('.ct-controls input,.ct-controls select').forEach(el=>el.addEventListener('input',()=>{if(kind==='syringe'&&el.id!=='ct-mode'){elapsed++;render(true);}else reset();}));
if($('start')){$('start').onclick=()=>{running=true;$('start').disabled=true;$('pause').disabled=false;};$('pause').onclick=()=>{running=false;render();};}
$('reset').onclick=reset;$('check').onclick=()=>{const a=mount.querySelector('input[name=ct-answer]:checked');$('feedback').textContent=!a?'Selectează un răspuns.':Number(a.value)===correct?'Corect! '+explanation:'Mai încearcă. '+explanation;};
mount.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const [m,t]=b.dataset.preset.split(',');$('mechanical').value=m;$('thermal').value=t;reset();});
reset();function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;const visible=mount.getBoundingClientRect().width>0;if(running&&visible){accumulator+=dt*Number($('speed').value);while(accumulator>=.02){elapsed+=.02;step(.02);accumulator-=.02;}render(true);}requestAnimationFrame(frame);}requestAnimationFrame(frame);
})();
</script></body></html>
