let running=false,last=0,elapsed=0,particles=[],real=[],events=[],collisionCount=0,totalImpulse=0,flashes=[],progress=0,trace=[],current={},seed=917;

const speed=t=>90*Math.sqrt(t/300);
function initParticles(n,w,h,t,r=0){let result=[];for(let i=0;i<n;i++){let x,y,tries=0;do{x=r+random()*(w-2*r);y=r+random()*(h-2*r);tries++;}while(r&&result.some(p=>(p.x-x)**2+(p.y-y)**2<(2*r+.5)**2)&&tries<20000);if(tries>=20000)throw Error('Nu există suficient spațiu pentru inițializare');const angle=random()*2*Math.PI;result.push({x,y,vx:speed(t)*Math.cos(angle),vy:speed(t)*Math.sin(angle)});}return result;}

function draw(){const canvas=$('canvas'),ctx=canvas.getContext('2d'),c=conditions();ctx.clearRect(0,0,canvas.width,canvas.height);if(kind==='state'){
