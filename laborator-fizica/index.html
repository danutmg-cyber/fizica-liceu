<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta
    name="description"
    content="Selectarea clasei pentru laboratorul de fizică."
  >

  <title>Laborator de fizică</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      place-items: center;
      color: #17324d;
      background: #edf4f7;
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    main {
      width: min(760px, 100%);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(1.8rem, 6vw, 3rem);
      text-align: center;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
    }

    a {
      display: flex;
      min-height: 82px;
      padding: 1rem;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      background: #075985;
      border: 2px solid #075985;
      border-radius: 13px;
      box-shadow: 0 7px 18px rgb(23 50 77 / 16%);
      font-size: clamp(1.05rem, 3vw, 1.25rem);
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      transition:
        background 150ms,
        transform 150ms,
        box-shadow 150ms;
    }

    a:hover {
      background: #0f766e;
      border-color: #0f766e;
      box-shadow: 0 11px 25px rgb(15 118 110 / 22%);
      transform: translateY(-2px);
    }

    a:focus-visible {
      outline: 4px solid #ffb000;
      outline-offset: 3px;
    }

    a:last-child {
      grid-column: 1 / -1;
    }

    @media (max-width: 520px) {
      nav {
        grid-template-columns: 1fr;
      }

      a,
      a:last-child {
        grid-column: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      a {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>Laborator de fizică</h1>

    <nav aria-label="Selectarea clasei">
      <a href="clasa6/index.html">Clasa a VI-a</a>
      <a href="clasa7/indexSSA.html">Clasa a VII-a</a>
      <a href="clasa8/index.html">Clasa a VIII-a</a>
      <a href="clasa9/index.html">Clasa a IX-a</a>
      <a href="clasa10/index.html">Clasa a X-a</a>
      <a href="clasa11/index.html">Clasa a XI-a</a>
      <a href="clasa12/index.html">Clasa a XII-a</a>
    </nav>
  </main>
</body>
</html>
